version: rules-v3
weights:
  quote: 35
  recommendation: 30
  switch: 25
  premium: 20
  vehicle: 15
  property: 15
  family: 10
  south_africa: 15
  insurer: 10
  broker: -60
  job: -50
  advertisement: -50
  news: -40
  non_target: -70
source_weights: {bluesky: 0, youtube: 0}
discard_below: 25
accept_without_llm_above: 85
local_confidence: 0.85
max_age_days: 30
# Final leads require explicit South African evidence (operator target: SA leads). Absence is not a
# hard reject: such records cannot finalize directly and wait for semantic review instead.
require_south_africa: true
negative_signals: [broker, job, advertisement, news, non_target]
# Personal short-term and long-term products that count as in-scope leads.
target_products: [MOTOR, HOME, CONTENTS, LIFE, FUNERAL, DISABILITY]
ranking:
  version: ordinal-rank-v2
  # These are configurable operating thresholds, not measured probabilities.
  rules_weight: 0.7
  contact_points: 1.0
  product_points: 1.0
  geography_points: 1.0
  local_positive_bonus: 0.5
  defer_at: 6.0
  semantic_at: 8.0
  direct_at: 9.5
  semantic_accept_score: 80
