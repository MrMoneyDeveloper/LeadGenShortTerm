version: rules-v4
weights:
  quote: 35
  recommendation: 30
  switch: 25
  premium: 20
  vehicle: 15
  property: 15
  family: 10
  broker_request: 30
  south_africa: 15
  insurer: 10
  broker: -60
  seller: -80
  job: -50
  advertisement: -50
  news: -40
  non_target: -70
source_weights: {bluesky: 0, youtube: 0, commoncrawl: 0}
# Operator decision 2026-11-09: generic business mailboxes published on South African company
# websites are a separate lead category (product_type BUSINESS_CONTACT). They need no consumer
# intent and never use semantic review: a record qualifies directly when its published address is a
# configured business mailbox on the site's own .za domain and passes syntax/MX validation. Consumer
# sources are unaffected; only the sources listed here use this path.
business_contact:
  sources: [commoncrawl]
  product_type: BUSINESS_CONTACT
  max_age_days: 400
  score: 50
  rank_score: 5.0  # ordinal placeholder: no intent is measured for this category
  # Insurers and brokers are competitors, not leads.
  reject_signals: [broker, seller]
  reject_terms: [insurance broker, insurance brokers, brokers, brokerage, insurer, insurers,
                 insurance company, insurance group, assurance, underwriting, underwriters]
discard_below: 25
accept_without_llm_above: 85
local_confidence: 0.85
max_age_days: 30
# Final leads require explicit South African evidence (operator target: SA leads). Absence is not a
# hard reject: such records cannot finalize directly and wait for semantic review instead.
require_south_africa: true
# Operator decision 2026-11-08: lead data is wanted even without a published email. Emails that are
# found are still syntax/MX-validated; leads without one carry validation_status NO_EMAIL.
require_contact: false
negative_signals: [broker, seller, job, advertisement, news, non_target]
# Personal short-term and long-term products that count as in-scope leads.
target_products: [MOTOR, HOME, CONTENTS, LIFE, FUNERAL, DISABILITY]
# A consumer request for a broker cancels only the broker-mention penalty for that record (never
# "seller"), and such conflicting records can never route DIRECT_FINAL.
negative_overrides: {broker: broker_request}
# Evidence that may be a seller or a consumer: never DIRECT_FINAL, semantic review decides.
review_only_signals: [broker_request, solicitation]
ranking:
  version: ordinal-rank-v2
  # These are configurable operating thresholds, not measured probabilities.
  rules_weight: 0.7
  contact_points: 1.0
  product_points: 1.0
  geography_points: 1.0
  local_positive_bonus: 0.5
  defer_at: 6.0
  semantic_at: 8.0
  direct_at: 9.5
  semantic_accept_score: 80
  # Records with explicit consumer intent, an in-scope product and SA evidence go to semantic review
  # even below semantic_at. Acceptance still requires semantic_qualified (unchanged).
  semantic_review:
    enabled: true
    intent_signals: [quote, recommendation, switch, broker_request]
