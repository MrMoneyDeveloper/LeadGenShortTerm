bluesky:
  enabled: true
  # search: targeted recency-bounded searchPosts over the phrases below (recommended).
  # firehose: random Jetstream sampling filtered by keywords (legacy; very low yield).
  mode: search
  max_requests_per_batch: 12
  pages_per_query: 1  # deeper pages need authentication; incremental passes cover new posts
  refresh_hours: 1
  overlap_hours: 1
  request_delay_seconds: 0.2
  fetch_profiles: true
  # Targeted comparison set (2026-11-09): product + consumer intent + South African context.
  # Discovery clues only; final qualification still needs evidence. Changing this list resets the
  # cursor through its query-set checkpoint.
  queries:
    - '"car insurance" johannesburg'
    - '"car insurance" "cape town"'
    - '"car insurance" durban'
    - '"car insurance" pretoria'
    - '"car insurance" "south africa"'
    - '"insurance quote" "south africa"'
    - '"home insurance" "south africa"'
    - '"funeral cover" "south africa"'
    - '"life cover" "south africa"'
    - miway premium
    - outsurance premium
    - santam premium
    - '"king price" insurance'
    - motorversekering
    - lewensversekering
  # Legacy firehose settings (mode: firehose)
  seconds: 20
  reconnects: 2
  replay_overlap_us: 1000000
youtube:
  enabled: true
  video_ids: []
  channel_ids: []
  # Each search costs 100 quota units; keep this list short on the Free quota.
  queries:
    - car insurance South Africa
    - funeral cover South Africa
    - life insurance South Africa
    - insurance quote South Africa
    - best insurance company South Africa
    - home insurance South Africa
  max_requests_per_batch: 10
  search_unit_cost: 100
  request_delay_seconds: 0.25
  refresh_hours: 24
  search_pages_per_query: 1
  comments_order: time
  recent_videos_only: true
  region_code: ZA
  relevance_language: en
  store_recent_only: true
  require_discovery_match: true
commoncrawl:
  # Generic business mailboxes published on South African (.za) websites, read from the public
  # Common Crawl index on data.commoncrawl.org. Only the local parts below, on the site's own .za
  # domain, are collected; addresses naming a person are never collected. Changing `crawl`
  # restarts the cursor for that crawl.
  enabled: true
  crawl: CC-MAIN-2026-43
  concurrency: 8  # measured: 8 -> ~3 pages/s from one machine; 12 triggers more 503 throttling
  pages_per_host: 1  # home page (or contact page when no home page was captured)
  max_emails_per_host: 3
  user_agent: "leadgen-shortterm/1.0 (business contact index; polite, range requests)"
  business_locals:
    - info
    - sales
    - enquiries
    - enquiry
    - enquire
    - contact
    - contactus
    - office
    - admin
    - hello
    - reception
    - accounts
    - bookings
    - reservations
    - orders
    - service
    - support
    - general
    - mail
    - quotes
    - marketing
