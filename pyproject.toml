[tool.pytest.ini_options]
pythonpath = ["services/render_api"]
testpaths = ["services/render_api/tests"]
markers = ["integration: requires an explicitly provided disposable PostgreSQL database"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008"] # FastAPI's Depends/Header/Query are declarative parameter defaults.

[tool.ruff.lint.isort]
known-first-party = ["app"]
